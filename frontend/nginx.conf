# Sirve el IDE (SPA de Vite/React Router) en avialo.app. El fallback a index.html
# es imprescindible para que rutas como /ide o /dashboard funcionen al recargar.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compresión de los activos de texto.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Activos con hash en el nombre → caché larga e inmutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html nunca se cachea: así un nuevo build se ve sin caché agresiva.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA: cualquier ruta que no sea un archivo real → index.html (React Router).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
