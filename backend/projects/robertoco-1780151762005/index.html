    <!-- Critical CSS (inline para optimización Core Web Vitals) -->
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            background-color: #f8f8f8;
            line-height: 1.6;
        }
        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
            color: #0056b3; /* Color principal derivado */
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .hero {
            background-color: #e0f2f7; /* Tono más claro del color principal */
            padding: 60px 20px;
            text-align: center;
        }
        .hero h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
        }
        .hero p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        .cta-button {
            display: inline-block;
            background-color: #007bff; /* Color principal */
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .cta-button:hover {
            background-color: #0056b3; /* Tono más oscuro */
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 0.9em;
        }
        footer a {
            color: #007bff;
            text-decoration: none;
            margin: 0 5px;
        }
        footer a:hover {
            text-decoration: underline;
        }

        /* Mobile-first: Estilos base para pantallas pequeñas */
        @media (min-width: 768px) {
            .hero h1 {
                font-size: 3.5em;
            }
            .hero p {
                font-size: 1.5em
