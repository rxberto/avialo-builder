    <style>
        :root {
            --primary-color: #1a56db;
            --primary-dark: #1542a8;
            --primary-light: #4d7ee0;
            --secondary-color: #f0f4f8;
            --text-dark: #333;
            --text-light: #fff;
            --accent-color: #ffc107; /* Amarillo para destacar */
            --border-radius: 8px;
            --spacing-unit: 1rem;
        }

        /* Basic Reset & Typography */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Lato', sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background-color: var(--secondary-color);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', sans-serif;
            color: var(--primary-dark);
            line-height: 1.2;
            margin-bottom: var(--spacing-unit);
        }

        h1 { font-size: 2.5rem; }
        h2 { font-size: 2rem; }
        h3 { font-size: 1.75rem; }

        @media (min-width: 768px) {
            h1 { font-size: 3.5rem; }
            h2 { font-size: 2.5rem; }
            h3 { font-size: 2rem; }
        }

        a {
            color: var(--primary-color);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--spacing-unit);
        }

        /* Buttons */
        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: var(--text-light);
            padding: 0.8rem 1.5rem;
            border-radius: var(--border-radius);
            text-decoration: none;
            font-weight: 700;
            transition: background-color 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn:hover {
            background-color: var(--primary-dark);
            text-decoration: none;
        }

        .btn-accent {
            background-color: var(--accent-color);
            color: var(--text-dark);
        }

        .btn-accent:hover {
            background-color: #e0a800;
        }

        /* Header */
        .header {
            background-color: var(--text-light);
            padding: var(--spacing-unit) 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            font-family: 'Poppins', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .nav-menu {
            list-style: none;
            display: flex;
            gap: 1.5rem;
        }

        .nav-menu a {
            color: var(--text-dark);
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .nav-menu a:hover {
            color: var(--primary-color);
            text-decoration: none;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('/img/hero-electricista.webp') no-repeat center center/cover; /* Placeholder */
            color: var(--text-light);
            text-align: center;
            padding: 6rem 0;
            display: flex;
            align-items: center;
            min-height: 60vh;
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            color: var(--text-light);
            margin-bottom: 1rem;
            font-size: 2.8rem;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .hero .btn {
            font-size: 1.1rem;
            padding: 1rem 2rem;
        }

        @media (min-width: 768px) {
            .hero h1 {
                font-size: 4rem;
            }
            .hero p {
                font-size: 1.5rem;
            }
        }

        /* Sections */
        .section {
            padding: 4rem 0;
            text-align: center;
        }

        .section:nth-of-type(even) {
            background-color: var(--text-light);
        }

        .section-title {
            margin-bottom: 3rem;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -10px;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background-color: var(--primary-color);
            border-radius: 2px;
        }

        /* Services */
        .services-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        @media (min-width: 600px) {
            .services-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 992px) {
            .services-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .service-item {
            background-color: var(--text-light);
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: left;
        }

        .service-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .service-item h3 {
            color: var(--primary-color);
            margin-bottom: 0.8rem;
            font-size: 1.5rem;
        }

        .service-item p {
            font-size: 0.95rem;
            color: #555;
        }
