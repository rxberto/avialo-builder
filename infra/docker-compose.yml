version: '3.8'

services:
  traefik:
    image: traefik:v2.11
    container_name: avialo-traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/acme.json:/acme.json
    networks:
      - avialo-network
    environment:
      - DOCKER_API_VERSION=1.40
      # Si usamos DNS challenge con Cloudflare, pasamos los tokens de entorno
      - CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL}
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN}

  postgres:
    image: postgres:16-alpine
    container_name: avialo-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - avialo-network

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: avialo-pgbouncer-prod
    restart: always
    environment:
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-postgres}
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=2000
      - DEFAULT_POOL_SIZE=50
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits
    ports:
      - "127.0.0.1:6432:5432"
    depends_on:
      - postgres
    networks:
      - avialo-network

  redis:
    image: redis:7-alpine
    container_name: avialo-redis-prod
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - avialo-network

  # Backend Medusa v2 COMPARTIDO por todas las tiendas ecommerce.
  # Aislamiento por tienda vía Sales Channel + Publishable API Key (no un Medusa por tenant).
  medusa:
    build:
      context: ../services/medusa-backend
      dockerfile: Dockerfile
    container_name: avialo-medusa
    restart: always
    environment:
      # BD DEDICADA de Medusa (gestiona su propio esquema) — conexión DIRECTA a Postgres,
      # NO vía pgbouncer transaction (Medusa usa prepared statements).
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${MEDUSA_DB_NAME:-medusa}
      - REDIS_URL=redis://redis:6379
      # CORS: permite los dominios de las tiendas de clientes (*.avialo.app) y el panel admin.
      - STORE_CORS=${MEDUSA_STORE_CORS:-/\.avialo\.app$$/}
      - ADMIN_CORS=${MEDUSA_ADMIN_CORS:-https://tienda-api.${PREVIEW_DOMAIN_BASE}}
      - AUTH_CORS=${MEDUSA_AUTH_CORS:-https://tienda-api.${PREVIEW_DOMAIN_BASE},/\.avialo\.app$$/}
      - JWT_SECRET=${MEDUSA_JWT_SECRET:-${JWT_SECRET}}
      - COOKIE_SECRET=${MEDUSA_COOKIE_SECRET:-${NEXTAUTH_SECRET}}
      # Checkout: misma cuenta Stripe del SaaS (o una dedicada). Vacío = checkout off.
      - STRIPE_API_KEY=${MEDUSA_STRIPE_API_KEY:-${STRIPE_SECRET_KEY}}
      # Primer arranque: crea BD, migra y siembra infraestructura base (región España).
      - MEDUSA_SEED_BASE=${MEDUSA_SEED_BASE:-true}
      - MEDUSA_ADMIN_EMAIL=${MEDUSA_ADMIN_EMAIL:-admin@avialo.app}
      - MEDUSA_ADMIN_PASSWORD=${MEDUSA_ADMIN_PASSWORD}
      - NODE_ENV=production
      # Cookie de sesión del admin: por defecto Secure (correcto tras Traefik/HTTPS). Si se
      # accede al panel por http://localhost (sin TLS), pon MEDUSA_COOKIE_SECURE=false o el
      # login rebota (la cookie Secure no se guarda sobre http).
      - MEDUSA_COOKIE_SECURE=${MEDUSA_COOKIE_SECURE:-}
      # Redsys: canal interno hacia el orquestador (firma/verificación con el secreto del tenant).
      # INTERNAL_API_TOKEN debe ser IDÉNTICO al del orquestador.
      - ORCHESTRATOR_INTERNAL_URL=${ORCHESTRATOR_INTERNAL_URL:-http://avialo-orchestrator:3000}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      # URL pública de Medusa para la notificación server-to-server de Redsys.
      - MEDUSA_PUBLIC_URL=${MEDUSA_PUBLIC_URL:-https://tienda-api.${PREVIEW_DOMAIN_BASE}}
    depends_on:
      - postgres
      - redis
    networks:
      - avialo-network
    labels:
      - "traefik.enable=true"
      # Store API + panel admin de Medusa en tienda-api.avialo.app
      - "traefik.http.routers.medusa.rule=Host(`tienda-api.${PREVIEW_DOMAIN_BASE}`)"
      - "traefik.http.routers.medusa.entrypoints=websecure"
      - "traefik.http.routers.medusa.tls=true"
      - "traefik.http.routers.medusa.tls.certresolver=letsencrypt"
      - "traefik.http.services.medusa.loadbalancer.server.port=9000"
      - "traefik.docker.network=avialo-network"

  orchestrator:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: avialo-orchestrator
    restart: always
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@pgbouncer:5432/${DB_NAME:-postgres}?schema=public&pgbouncer=true
      - REDIS_URL=redis://redis:6379
      - DOCKER_SOCKET=/var/run/docker.sock
      - PORT=3000
      # Sandbox: el worker escribe en /app/sandbox (volumen) y los contenedores hijos
      # se montan con la ruta del HOST (SANDBOX_HOST_DIR) porque el daemon vive en el host.
      - SANDBOX_DIR=/app/sandbox
      - SANDBOX_HOST_DIR=${SANDBOX_HOST_DIR}
      # Almacén de fotos propias del negocio subidas por el cliente (compartido con el worker).
      - UPLOADS_DIR=/app/uploads
      - PREVIEW_DOMAIN_BASE=${PREVIEW_DOMAIN_BASE}
      # Auditoría de rendimiento real (PageSpeed Insights). Opcional: vacío funciona con cuota
      # limitada por IP; con clave sube el límite.
      - PAGESPEED_API_KEY=${PAGESPEED_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LITELLM_URL=${LITELLM_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}
      - LLM_PRIMARY=${LLM_PRIMARY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      # Price IDs de los planes (los genera `npm run stripe:setup` o se copian del Dashboard).
      - STRIPE_PRICE_CORPORATIVA=${STRIPE_PRICE_CORPORATIVA}
      - STRIPE_PRICE_DINAMICA=${STRIPE_PRICE_DINAMICA}
      - STRIPE_PRICE_ECOMMERCE=${STRIPE_PRICE_ECOMMERCE}
      # IVA automático (Stripe Tax). Precios IVA incluido. Activar solo cuando Stripe Tax
      # esté configurado en el Dashboard (registro fiscal España); si no, dejar sin definir.
      - STRIPE_AUTOMATIC_TAX=${STRIPE_AUTOMATIC_TAX}
      # Pagos de las tiendas: cifrado de secretos de pasarela (Redsys) + canal interno con Medusa.
      - AVIALO_SECRETS_KEY=${AVIALO_SECRETS_KEY}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      # Medusa: el PORTERO (API tenant-store del panel /admin) corre en el orquestador y se
      # autentica contra Medusa para gestionar productos/pedidos/etc. de cada tienda.
      - MEDUSA_BACKEND_URL=${MEDUSA_BACKEND_URL:-http://medusa:9000}
      - MEDUSA_ADMIN_EMAIL=${MEDUSA_ADMIN_EMAIL:-admin@avialo.app}
      - MEDUSA_ADMIN_PASSWORD=${MEDUSA_ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NODE_ENV=production
      - SENTRY_DSN=${SENTRY_DSN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPENPROVIDER_USERNAME=${OPENPROVIDER_USERNAME}
      - OPENPROVIDER_PASSWORD=${OPENPROVIDER_PASSWORD}
      - OPENPROVIDER_OWNER_HANDLE=${OPENPROVIDER_OWNER_HANDLE}
      - OPENPROVIDER_NS=${OPENPROVIDER_NS}
      - DNS_TARGET_IP=${DNS_TARGET_IP}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../sandbox:/app/sandbox
      # Fotos del negocio subidas por los clientes (mismo host dir que el worker).
      - ../uploads:/app/uploads
      # Boilerplates (Next.js + Tailwind ya configurados) que el scaffold copia por cliente.
      - ../boilerplates:/app/boilerplates:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - pgbouncer
      - redis
    networks:
      - avialo-network
    labels:
      - "traefik.enable=true"
      # Enrutar api.avialo.app para endpoints del orquestador
      - "traefik.http.routers.avialoapi.rule=Host(`api.avialo.app`)"
      - "traefik.http.routers.avialoapi.entrypoints=websecure"
      - "traefik.http.routers.avialoapi.tls=true"
      - "traefik.http.routers.avialoapi.tls.certresolver=letsencrypt"
      - "traefik.http.services.avialoapi.loadbalancer.server.port=3000"
      - "traefik.docker.network=avialo-network"

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: avialo-worker
    restart: always
    # Proceso worker independiente: consume la cola de generación de BullMQ.
    # No expone HTTP ni rutas Traefik. Comparte estado con la API vía Redis.
    command: ["npm", "run", "worker"]
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@pgbouncer:5432/${DB_NAME:-postgres}?schema=public&pgbouncer=true
      - REDIS_URL=redis://redis:6379
      - DOCKER_SOCKET=/var/run/docker.sock
      # Sandbox (ver nota en el servicio backend): imprescindible para que el build
      # encuentre los archivos del proyecto al montar contenedores hijos.
      - SANDBOX_DIR=/app/sandbox
      - SANDBOX_HOST_DIR=${SANDBOX_HOST_DIR}
      # Almacén de fotos del negocio (mismo host dir que la API, para copiarlas al sandbox).
      - UPLOADS_DIR=/app/uploads
      # Base de dominio para previews enrutados por Traefik (HTTPS). Vacío = localhost.
      - PREVIEW_DOMAIN_BASE=${PREVIEW_DOMAIN_BASE}
      - LITELLM_URL=${LITELLM_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}
      - LLM_PRIMARY=${LLM_PRIMARY}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
      - GENERATION_CONCURRENCY=${GENERATION_CONCURRENCY:-1}
      - BUILD_MEMORY_BYTES=${BUILD_MEMORY_BYTES:-2147483648}
      - RUNTIME_MEMORY_BYTES=${RUNTIME_MEMORY_BYTES:-268435456}
      - MAX_JOB_COST_USD=${MAX_JOB_COST_USD:-2.0}
      - SENTRY_DSN=${SENTRY_DSN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Backend Medusa compartido: el worker aprovisiona la tienda de cada cliente ecommerce.
      - MEDUSA_BACKEND_URL=${MEDUSA_BACKEND_URL:-http://medusa:9000}
      - MEDUSA_ADMIN_EMAIL=${MEDUSA_ADMIN_EMAIL:-admin@avialo.app}
      - MEDUSA_ADMIN_PASSWORD=${MEDUSA_ADMIN_PASSWORD}
      # Comisión de plataforma (puntos básicos) que el worker inyecta en las storefronts (Stripe Connect).
      - AVIALO_PLATFORM_FEE_BPS=${AVIALO_PLATFORM_FEE_BPS:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../sandbox:/app/sandbox
      - ../uploads:/app/uploads
      - ../boilerplates:/app/boilerplates:ro
    depends_on:
      - pgbouncer
      - redis
      - medusa
    networks:
      - avialo-network

  # NOTA: el IDE/dashboard (frontend Vite) se despliega en Vercel desde la rama `prod`
  # (Production Branch del proyecto). Por eso NO hay servicio `frontend` aquí: evitamos que
  # un `docker compose up --build` arranque un nginx que pelee con Vercel por avialo.app y
  # rompa el certificado. El Dockerfile/nginx del frontend quedan en el repo por si algún día
  # se migra a self-host (repuntando el DNS de avialo.app a este droplet).

volumes:
  postgres_data:
  redis_data:

networks:
  avialo-network:
    external: true
